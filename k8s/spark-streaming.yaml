apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-streaming
  namespace: text-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spark-streaming
  template:
    metadata:
      labels:
        app: spark-streaming
    spec:
      initContainers:
        - name: wait-kafka
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo "waiting for kafka..."; sleep 3; done']
        - name: wait-elasticsearch
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z elasticsearch 9200; do echo "waiting for elasticsearch..."; sleep 3; done']
        - name: wait-minio
          image: busybox:1.35
          command: ['sh', '-c', 'until nc -z minio 9000; do echo "waiting for minio..."; sleep 3; done']
      containers:
        - name: spark-streaming
          image: vn-text-search/spark-jobs:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPARK_JOB
              value: "streaming_indexer.py"
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY
          envFrom:
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
