---
# Chạy mỗi ngày lúc 2:00 AM — pivot số bài theo ngày x category
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-batch-pivot
  namespace: text-search
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: spark-batch-pivot
              image: vn-text-search/spark-jobs:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: SPARK_JOB
                  value: "batch_pivot.py"
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: MINIO_SECRET_KEY
              envFrom:
                - configMapRef:
                    name: app-config
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1500m"
---
