---
# 01:00 AM - sort-merge join + broadcast join enrichment
apiVersion: batch/v1
kind: CronJob
metadata:
  name: spark-batch-enricher
  namespace: text-search
spec:
  schedule: "0 1 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: spark-batch-enricher
              image: k3d-myregistry:5000/vn-text-search/spark-jobs:latest
              imagePullPolicy: IfNotPresent
              args: ["/opt/spark-jobs/enricher.py"]
              env:
                - name: SPARK_JOB
                  value: "enricher.py"
                - name: CHECKPOINT_BASE
                  value: "s3a://spark-checkpoints"
                - name: MINIO_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: MINIO_SECRET_KEY
              envFrom:
                - configMapRef:
                    name: app-config
              resources:
                requests:
                  memory: "1Gi"
                  cpu: "500m"
                limits:
                  memory: "2Gi"
                  cpu: "1500m"
---
