apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: text-search
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      - job_name: elasticsearch
        metrics_path: /metrics
        static_configs:
          - targets: ["elasticsearch-exporter:9114"]

      - job_name: kafka
        metrics_path: /metrics
        static_configs:
          - targets: ["kafka-exporter:9308"]

      - job_name: spark-master
        metrics_path: /metrics
        static_configs:
          - targets: ["spark-master:8080"]

      - job_name: api
        metrics_path: /metrics
        static_configs:
          - targets: ["api:8000"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: text-search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          resources:
            requests:
              memory: "256Mi"
              cpu: "125m"
            limits:
              memory: "512Mi"
              cpu: "250m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-rules
              mountPath: /etc/prometheus/rules
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-rules
          configMap:
            name: prometheus-rules
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: text-search
data:
  vn-text-search-alerts.yml: |
    groups:
      - name: vn-text-search
        rules:
          - alert: ElasticsearchDown
            expr: up{job="elasticsearch"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Elasticsearch is down"

          - alert: KafkaDown
            expr: up{job="kafka"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Kafka is down"

          - alert: APIHighLatency
            expr: http_request_duration_seconds_p99{job="api"} > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "API P99 latency > 2s"
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: text-search
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
